  <!-- ================= LOADER =================
       Carica l'app originale (self-contained) dal commit fissato via CDN
       e inietta il FX layer (fx/fx.css + fx/fx.js + fx/globe-land.js +
       fx/fx-globe.js) dopo il mount.
       I ?v=N forzano il refresh oltre la cache di 10 min di GitHub Pages:
       incrementa N a ogni modifica degli asset fx.
       ANALYTICS: per attivare GoatCounter sostituisci il valore di GC_CODE
       qui sotto con il tuo site code (vedi ISTRUZIONI-ANALYTICS.md). -->
  <script>
  (function () {
    "use strict";
    var GC_CODE = "TUOCODICE"; // <-- il tuo codice GoatCounter (es. "alessandrochiri")
    var FXV = "5"; // <-- versione asset fx (cache-busting)
    var COMMIT  = "d85b4a94e5ef03f3cbcd6301d19963d456c6af6a";
    var SOURCES = [
      "https://cdn.jsdelivr.net/gh/Benz91x/Alessandro-Chiri@" + COMMIT + "/index.html",
      "https://raw.githubusercontent.com/Benz91x/Alessandro-Chiri/" + COMMIT + "/index.html"
    ];

    function fail() {
      var d = document.createElement("div");
      d.style.cssText = "position:fixed;inset:0;display:flex;flex-direction:column;gap:14px;" +
        "align-items:center;justify-content:center;background:#07090c;color:#f4fffd;" +
        "font-family:system-ui,sans-serif;z-index:99999;text-align:center;padding:24px";
      d.innerHTML = '<div style="font-size:18px">Impossibile caricare la pagina.</div>' +
        '<button onclick="location.reload()" style="padding:10px 22px;border-radius:8px;' +
        'border:1px solid #2dd4bf;background:transparent;color:#2dd4bf;font-size:15px;cursor:pointer">Riprova</button>';
      document.body.appendChild(d);
    }

    function injectFX() {
      var tries = 0;
      var iv = setInterval(function () {
        if (document.getElementById("ac-root") || ++tries > 60) {
          clearInterval(iv);
          var l = document.createElement("link");
          l.rel = "stylesheet"; l.href = "fx/fx.css?v=" + FXV;
          document.head.appendChild(l);
          /* async=false => esecuzione nell'ordine di inserimento */
          var s = document.createElement("script");
          s.src = "fx/fx.js?v=" + FXV; s.async = false;
          document.body.appendChild(s);
          var d = document.createElement("script");
          d.src = "fx/globe-land.js?v=" + FXV; d.async = false;
          document.body.appendChild(d);
          var g = document.createElement("script");
          g.src = "fx/fx-globe.js?v=" + FXV; g.async = false;
          document.body.appendChild(g);
        }
      }, 200);
    }

    function load(i) {
      if (i >= SOURCES.length) { fail(); return; }
      fetch(SOURCES[i])
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
        .then(function (html) {
          if (html.indexOf("__bundler/template") === -1) throw new Error("bad payload");
          html = html.split("TUOCODICE").join(GC_CODE);
          document.open();
          document.write(html);
          document.close();
          injectFX();
        })
        .catch(function () { load(i + 1); });
    }
    load(0);
  })();
  </script>
